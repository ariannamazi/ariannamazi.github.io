<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>

  <!-- Boxes -->
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="60" width="140" height="80" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
    <text x="90" y="95" font-weight="bold">Speech</text>
    <text x="90" y="117" font-size="13">audio stream</text>

    <rect x="200" y="60" width="150" height="80" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
    <text x="275" y="95" font-weight="bold">Gesture Model</text>
    <text x="275" y="117" font-size="13">e.g. LiveGesture</text>

    <rect x="390" y="60" width="150" height="80" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
    <text x="465" y="95" font-weight="bold">Contact &amp;</text>
    <text x="465" y="115" font-weight="bold">Artifact Detection</text>

    <rect x="580" y="60" width="150" height="80" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
    <text x="655" y="95" font-weight="bold">IK Refinement</text>
    <text x="655" y="117" font-size="13">+ temporal smoothing</text>

    <rect x="770" y="60" width="110" height="80" rx="10" fill="#e6f6ea" stroke="#2e9a4a" stroke-width="2"/>
    <text x="825" y="95" font-weight="bold">Rendered</text>
    <text x="825" y="117" font-size="13">avatar</text>
  </g>

  <!-- Arrows -->
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="160" y1="100" x2="196" y2="100"/>
    <line x1="350" y1="100" x2="386" y2="100"/>
    <line x1="540" y1="100" x2="576" y2="100"/>
    <line x1="730" y1="100" x2="766" y2="100"/>
  </g>

  <!-- Bracket for our contribution -->
  <path d="M390,165 L390,175 L730,175 L730,165" fill="none" stroke="#e08a00" stroke-width="2"/>
  <text x="560" y="200" font-size="14" text-anchor="middle" fill="#e08a00" font-weight="bold">Our refinement layer (real-time, per motion chunk)</text>
  <path d="M200,45 L200,35 L350,35 L350,45" fill="none" stroke="#3b6fd8" stroke-width="2"/>
  <text x="275" y="25" font-size="14" text-anchor="middle" fill="#3b6fd8" font-weight="bold">Existing pretrained model</text>
</svg>
