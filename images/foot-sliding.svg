<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- ===== Left: Before ===== -->
  <text x="225" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#c0392b">Before: generated motion</text>
  <line x1="40" y1="250" x2="410" y2="250" stroke="#888" stroke-width="3"/>

  <!-- Ghost frames (faded) -->
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.25">
    <circle cx="190" cy="85" r="16"/>
    <line x1="190" y1="101" x2="190" y2="170"/>
    <line x1="190" y1="170" x2="160" y2="210"/><line x1="160" y1="210" x2="150" y2="250"/>
    <line x1="190" y1="170" x2="215" y2="210"/><line x1="215" y1="210" x2="225" y2="250"/>
  </g>
  <!-- Current frame -->
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="240" cy="85" r="16"/>
    <line x1="240" y1="101" x2="240" y2="170"/>
    <line x1="240" y1="120" x2="205" y2="150"/><line x1="240" y1="120" x2="280" y2="100"/>
    <line x1="240" y1="170" x2="210" y2="212"/><line x1="210" y1="212" x2="200" y2="262"/>
    <line x1="240" y1="170" x2="265" y2="210"/><line x1="265" y1="210" x2="275" y2="250"/>
  </g>
  <!-- Sliding arrow -->
  <line x1="155" y1="275" x2="195" y2="275" stroke="#c0392b" stroke-width="2"/>
  <path d="M195,270 L205,275 L195,280 z" fill="#c0392b"/>
  <text x="120" y="295" font-size="13" fill="#c0392b">foot slides + sinks into floor</text>

  <!-- ===== Right: After ===== -->
  <text x="675" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e9a4a">After: contact-aware refinement</text>
  <line x1="490" y1="250" x2="860" y2="250" stroke="#888" stroke-width="3"/>

  <g stroke="#2e9a4a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.25">
    <circle cx="640" cy="85" r="16"/>
    <line x1="640" y1="101" x2="640" y2="170"/>
    <line x1="640" y1="170" x2="615" y2="210"/><line x1="615" y1="210" x2="610" y2="250"/>
    <line x1="640" y1="170" x2="665" y2="210"/><line x1="665" y1="210" x2="675" y2="250"/>
  </g>
  <g stroke="#2e9a4a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="690" cy="85" r="16"/>
    <line x1="690" y1="101" x2="690" y2="170"/>
    <line x1="690" y1="120" x2="655" y2="150"/><line x1="690" y1="120" x2="730" y2="100"/>
    <line x1="690" y1="170" x2="640" y2="212"/><line x1="640" y1="212" x2="610" y2="250"/>
    <line x1="690" y1="170" x2="715" y2="210"/><line x1="715" y1="210" x2="725" y2="250"/>
  </g>
  <!-- Contact markers -->
  <circle cx="610" cy="250" r="7" fill="#2e9a4a"/>
  <circle cx="725" cy="250" r="7" fill="#2e9a4a"/>
  <text x="560" y="285" font-size="13" fill="#2e9a4a">foot stays planted (IK adjusts the leg)</text>
</svg>
